services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      INCUBRIX_DATA: /srv/data
      INCUBRIX_DB: /srv/data/incubrix.sqlite3
      WEB_ORIGIN: http://localhost:5173
    volumes:
      - incubrix-data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  incubrix-data:
